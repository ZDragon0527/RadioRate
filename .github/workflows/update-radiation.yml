name: 방사선량 데이터 수집 및 배포

on:
  # 주 실행 계기: 외부 예약 서비스(cron-job.org 등)가 약 15분마다 workflow_dispatch를 호출한다.
  #   GitHub 자체 예약(schedule)은 부하 시 지연·누락이 잦아 주기를 보장하지 못한다(docs/외부예약_설정안내.md 참고).
  # 아래 schedule은 외부 예약이 멈췄을 때를 대비한 1시간 간격 예비 실행이다.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: 직전 배포본 데이터 가져오기
        run: curl -fsSL --max-time 20 "${{ steps.pages.outputs.base_url }}/data/radiation.json" -o prev.json || echo '{}' > prev.json

      - name: 사이트 구성
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll assets _site/

      - name: 최신 안드로이드 APK 정보 기록
        # 페이지가 방문자마다 GitHub API를 호출하면 같은 공인 IP(회사망 등)에서 시간당 한도에 걸릴 수 있어,
        # 배포 시점에 한 번만 조회해 정적 파일(app-release.json)로 함께 올린다. 실패해도 배포는 계속한다.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" \
            --jq '{version: (.tag_name | sub("^android-v"; "")), publishedAt: .published_at,
                   apk: ([.assets[] | select(.name == "radiorate.apk") | {url: .browser_download_url, size: .size}] | first)}' \
            > _site/app-release.json 2>/dev/null || echo '{}' > _site/app-release.json
          cat _site/app-release.json

      - name: 공공데이터포털 API 수집
        id: collect
        env:
          RADIORATE_SERVICE_KEY: ${{ secrets.RADIORATE_SERVICE_KEY }}
        run: node scripts/fetch-radiation.mjs --prev prev.json --out _site/data/radiation.json || echo "failed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 수집 실패 알림
        if: steps.collect.outputs.failed == 'true'
        run: |
          echo "::error::5개 본부 모두 데이터 수집에 실패했습니다. 위 '공공데이터포털 API 수집' 단계 로그를 확인하세요. (직전 값으로 배포됨)"
          exit 1
