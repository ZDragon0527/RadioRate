name: 방사선량 데이터 수집 및 배포

# 구조 (2026-11 변경)
#  - collect: 공공데이터포털 API 수집 결과(radiation.json)를 저장소의 `data` 브랜치에 덮어쓴다.
#             웹·앱은 raw.githubusercontent.com에서 이 파일을 읽는다.
#             같은 커밋으로 10분마다 Pages를 다시 배포하면, Pages가 '성공'으로 받고도 사이트에
#             반영하지 않는 일이 반복돼(2026-11-05, 11-07~08) 측정 데이터를 Pages 배포에서 분리했다.
#  - deploy-site: 화면 코드(index.html 등)를 GitHub Pages에 배포한다.
#             main에 push했을 때, 또는 수동 실행에서 deploy_site=true일 때만 실행한다.

on:
  # 주 실행 계기: 외부 예약 서비스(cron-job.org 등)가 약 10분마다 workflow_dispatch를 호출한다.
  #   GitHub 자체 예약(schedule)은 부하 시 지연·누락이 잦아 주기를 보장하지 못한다(docs/외부예약_설정안내.md 참고).
  # 아래 schedule은 외부 예약이 멈췄을 때를 대비한 1시간 간격 예비 실행이다.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      deploy_site:
        description: '화면(GitHub Pages)도 다시 배포'
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # data 브랜치에 수집 결과 기록
    concurrency:
      group: radiation-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 직전 수집본 가져오기
        # data 브랜치의 직전 파일로 24시간 추이를 이어 붙인다.
        # data 브랜치가 아직 없으면(전환 첫 실행) 기존 Pages 사이트의 파일을 쓴다.
        run: |
          if git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:radiation.json > prev.json; then
            echo "직전 수집본: data 브랜치"
          else
            curl -fsSL --max-time 20 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/radiation.json" -o prev.json \
              && echo "직전 수집본: Pages 사이트" || echo '{}' > prev.json
          fi

      - name: 공공데이터포털 API 수집
        id: collect
        env:
          RADIORATE_SERVICE_KEY: ${{ secrets.RADIORATE_SERVICE_KEY }}
        # Only exit 2 means a valid fallback JSON was written after all plants failed.
        # Unexpected errors (including output-file errors) must stop publishing.
        run: |
          status=0
          node scripts/fetch-radiation.mjs --prev prev.json --out out/radiation.json || status=$?
          case "$status" in
            0) echo "result=success" >> "$GITHUB_OUTPUT" ;;
            2) echo "result=all_failed" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=fatal" >> "$GITHUB_OUTPUT"; exit "$status" ;;
          esac

      - name: API 네트워크 진단
        id: diagnostics
        if: ${{ always() && (steps.collect.outputs.failed_count > 0 || steps.collect.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        run: bash scripts/diagnose-api-network.sh

      - name: data 브랜치에 게시
        id: publish
        if: ${{ success() && (steps.collect.outputs.result == 'success' || steps.collect.outputs.result == 'all_failed') }}
        env:
          GH_TOKEN: ${{ github.token }}
        # 이력이 쌓이지 않도록 매번 커밋 하나짜리 브랜치로 덮어쓴다(force push).
        run: |
          mkdir -p publish && cp out/radiation.json publish/
          cd publish
          git init -q -b data
          git add radiation.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "측정 데이터 $(jq -r '.fetchedAt' radiation.json)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
          echo "게시 완료: $(jq -r '.fetchedAt' radiation.json)"

      - name: 수집 및 게시 결과 요약
        if: always()
        env:
          COLLECTION_RESULT: ${{ steps.collect.outputs.result }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.publish.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: node scripts/summarize-radiation.mjs out/radiation.json

      - name: 수집 실패 알림
        if: ${{ always() && steps.collect.outputs.result == 'all_failed' }}
        run: |
          echo "::error::5개 본부 모두 데이터 수집에 실패했습니다. API 수집 로그와 결과 요약에서 실패 사유·직전 값 보존 여부를 확인하세요."
          exit 1

  deploy-site:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_site) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 사이트 구성
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll assets _site/

      - name: 최신 안드로이드 APK 정보 기록
        # 페이지가 방문자마다 GitHub API를 호출하면 같은 공인 IP(회사망 등)에서 시간당 한도에 걸릴 수 있어,
        # 배포 시점에 한 번만 조회해 정적 파일(app-release.json)로 함께 올린다. 실패해도 배포는 계속한다.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" \
            --jq '{version: (.tag_name | sub("^android-v"; "")), publishedAt: .published_at,
                   apk: ([.assets[] | select(.name == "radiorate.apk") | {url: .browser_download_url, size: .size}] | first)}' \
            > _site/app-release.json 2>/dev/null || echo '{}' > _site/app-release.json
          cat _site/app-release.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
