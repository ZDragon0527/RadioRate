name: 안드로이드 앱(APK) 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # GitHub Releases에 APK 업로드
  actions: write    # 게시 후 사이트 재배포(다운로드 버튼 정보 갱신) 실행

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3
        with:
          # 기본값의 'tools' 패키지는 SDK 저장소에서 더 이상 제공되지 않아 실패한다.
          # 플랫폼·빌드도구는 Gradle이 라이선스 수락 후 필요한 버전을 자동으로 받는다.
          packages: 'platform-tools'

      - name: Capacitor 의존성 설치 및 동기화
        run: |
          npm ci
          npx cap sync android

      - name: 서명 키 복원
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 Secret이 없어 서명되지 않은 확인용 빌드만 수행합니다. 릴리스는 만들지 않습니다."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK 빌드
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.present == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/radiorate.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/radiorate-debug.apk"
          fi

      - name: 서명 확인
        if: steps.keystore.outputs.present == 'true'
        working-directory: .
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs radiorate.apk | head -5

      - name: 빌드 결과 보관 (확인용)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: radiorate*.apk
          retention-days: 14

      - name: GitHub Releases에 게시
        if: steps.keystore.outputs.present == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" radiorate.apk \
            --repo "${{ github.repository }}" \
            --title "안드로이드 앱 1.0.${{ github.run_number }}" \
            --notes "원전 방사선량 안드로이드 앱. radiorate.apk를 내려받아 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱 설치' 허용이 필요할 수 있습니다." \
            --latest

      - name: 사이트 재배포 요청 (다운로드 버튼 정보 갱신)
        if: steps.keystore.outputs.present == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-radiation.yml --repo "${{ github.repository }}" --ref main
